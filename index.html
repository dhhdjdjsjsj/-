<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎨 Песочница</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #f7f7f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    #toolbar {
      width: 100%;
      padding: 10px;
      background: #ffffff;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      z-index: 1;
    }

    #toolbar label, #toolbar button {
      font-size: 14px;
    }

    canvas {
      border: 1px solid #ccc;
      background-color: white;
      touch-action: none;
      margin-top: 5px;
    }

    input[type="range"] {
      width: 80px;
    }

    @media (max-width: 768px) {
      canvas {
        width: 95vw;
        height: 60vh;
      }
    }

    @media (min-width: 769px) {
      canvas {
        width: 800px;
        height: 600px;
      }
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <label>🎨 Цвет кисти: <input type="color" id="colorPicker" value="#000000" /></label>
    <label>📏 Размер кисти: <input type="range" id="brushSize" min="1" max="50" value="5" /></label>
    <label>🧽 Ластик: <input type="checkbox" id="eraserToggle" /></label>
    <label>🖼️ Цвет фона: <input type="color" id="bgColor" value="#ffffff" /></label>
    <button id="clearBtn">🗑 Очистить</button>
    <button id="saveBtn">💾 Сохранить</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const colorPicker = document.getElementById("colorPicker");
    const brushSizeInput = document.getElementById("brushSize");
    const eraserToggle = document.getElementById("eraserToggle");
    const bgColorPicker = document.getElementById("bgColor");

    let drawing = false;
    let brushColor = colorPicker.value;
    let brushSize = brushSizeInput.value;
    let erasing = false;

    // Установка размеров холста
    function resizeCanvas() {
      const temp = ctx.getImageData(0, 0, canvas.width, canvas.height);
      if (window.innerWidth < 768) {
        canvas.width = window.innerWidth * 0.95;
        canvas.height = window.innerHeight * 0.6;
      } else {
        canvas.width = 800;
        canvas.height = 600;
      }
      ctx.putImageData(temp, 0, 0);
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Заливка фона
    function fillBackground() {
      ctx.fillStyle = bgColorPicker.value;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    fillBackground();

    // Слушатели интерфейса
    colorPicker.addEventListener("input", e => brushColor = e.target.value);
    brushSizeInput.addEventListener("input", e => brushSize = e.target.value);
    eraserToggle.addEventListener("change", e => erasing = e.target.checked);
    bgColorPicker.addEventListener("input", () => fillBackground());

    // Очистка холста
    document.getElementById("clearBtn").addEventListener("click", () => {
      fillBackground();
    });

    // Сохранение в PNG
    document.getElementById("saveBtn").addEventListener("click", () => {
      const link = document.createElement('a');
      link.download = "рисунок.png";
      link.href = canvas.toDataURL();
      link.click();
    });

    // Рисование
    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      drawing = true;
      const { x, y } = getCoords(e);
      ctx.beginPath();
      ctx.moveTo(x, y);
      draw(e);
    }

    function endDrawing() {
      drawing = false;
      ctx.beginPath();
    }

    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const { x, y } = getCoords(e);

      ctx.lineWidth = brushSize;
      ctx.lineCap = "round";
      ctx.strokeStyle = erasing ? bgColorPicker.value : brushColor;

      ctx.lineTo(x, y);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x, y);
    }

    // Слушатели мыши и касаний
    canvas.addEventListener("mousedown", startDrawing);
    canvas.addEventListener("mouseup", endDrawing);
    canvas.addEventListener("mousemove", draw);

    canvas.addEventListener("touchstart", startDrawing);
    canvas.addEventListener("touchend", endDrawing);
    canvas.addEventListener("touchmove", draw);
  </script>

</body>
</html>
