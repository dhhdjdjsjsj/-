<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🐍 Змейка</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #0f172a;
      --panel: #111827;
      --accent: #22c55e;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 24px 16px 8px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .game-wrapper {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      width: min(960px, 100%);
      padding: 16px;
    }

    .panel {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 20px 45px rgba(15, 23, 42, 0.35);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }

    .stat {
      display: grid;
      gap: 4px;
    }

    .stat strong {
      font-size: 20px;
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    .controls button,
    .controls select {
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 10px 12px;
      background: #0b1221;
      color: var(--text);
      font-size: 14px;
    }

    .controls button {
      cursor: pointer;
      transition: transform 0.2s ease, border 0.2s ease;
    }

    .controls button:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .controls button.secondary {
      border-color: rgba(148, 163, 184, 0.4);
    }

    .controls button.danger {
      border-color: var(--danger);
      color: #fecaca;
    }

    .board {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    canvas {
      background: #0b1120;
      border-radius: 16px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      width: min(80vw, 560px);
      height: min(80vw, 560px);
      max-height: 560px;
      max-width: 560px;
    }

    .hint {
      font-size: 13px;
      color: var(--muted);
    }

    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px);
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .mobile-controls button {
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: #0b1221;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
    }

    .mobile-controls button:active {
      border-color: var(--accent);
    }

    @media (min-width: 900px) {
      .game-wrapper {
        grid-template-columns: 2fr 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🐍 Игра «Змейка»</h1>
    <p>Собирай еду, ускоряйся и побей рекорд. Управление: стрелки или WASD.</p>
  </header>

  <main class="game-wrapper">
    <section class="panel board">
      <canvas id="game" width="560" height="560" aria-label="Поле игры"></canvas>
      <div class="hint">Пауза: пробел. Перезапуск: кнопка «Новая игра».</div>
      <div class="mobile-controls" aria-hidden="true">
        <span></span>
        <button type="button" data-dir="up">▲</button>
        <span></span>
        <button type="button" data-dir="left">◀</button>
        <button type="button" data-dir="down">▼</button>
        <button type="button" data-dir="right">▶</button>
      </div>
    </section>

    <aside class="panel controls">
      <div class="stats">
        <div class="stat">
          <span>Счёт</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>Рекорд</span>
          <strong id="best">0</strong>
        </div>
        <div class="stat">
          <span>Скорость</span>
          <strong id="speed">1x</strong>
        </div>
      </div>

      <label>
        Режим скорости
        <select id="difficulty">
          <option value="easy">Спокойный</option>
          <option value="normal" selected>Классика</option>
          <option value="fast">Турбо</option>
        </select>
      </label>

      <button id="toggle">Пауза</button>
      <button id="newGame" class="secondary">Новая игра</button>
      <button id="resetBest" class="danger">Сбросить рекорд</button>

      <p class="hint">Скорость растёт после каждой еды. Рекорд хранится в браузере.</p>
    </aside>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const speedEl = document.getElementById("speed");
    const difficultySelect = document.getElementById("difficulty");
    const toggleBtn = document.getElementById("toggle");
    const newGameBtn = document.getElementById("newGame");
    const resetBestBtn = document.getElementById("resetBest");

    const GRID_SIZE = 20;
    const CELL_COUNT = canvas.width / GRID_SIZE;
    const INITIAL_SNAKE = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 }
    ];

    const difficultySettings = {
      easy: 170,
      normal: 130,
      fast: 100
    };

    let snake = [];
    let direction = { x: 1, y: 0 };
    let nextDirection = { x: 1, y: 0 };
    let food = { x: 5, y: 5 };
    let score = 0;
    let bestScore = 0;
    let speedMultiplier = 1;
    let isRunning = true;
    let loopId;

    function loadBestScore() {
      const stored = Number.parseInt(localStorage.getItem("snakeBest") || "0", 10);
      bestScore = Number.isNaN(stored) ? 0 : stored;
      bestEl.textContent = bestScore;
    }

    function saveBestScore() {
      localStorage.setItem("snakeBest", bestScore.toString());
    }

    function updateStats() {
      scoreEl.textContent = score;
      bestEl.textContent = bestScore;
      speedEl.textContent = `${speedMultiplier.toFixed(1)}x`;
    }

    function resetGame() {
      snake = INITIAL_SNAKE.map(segment => ({ ...segment }));
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      speedMultiplier = 1;
      isRunning = true;
      spawnFood();
      updateStats();
      toggleBtn.textContent = "Пауза";
      restartLoop();
    }

    function spawnFood() {
      let position;
      do {
        position = {
          x: Math.floor(Math.random() * CELL_COUNT),
          y: Math.floor(Math.random() * CELL_COUNT)
        };
      } while (snake.some(segment => segment.x === position.x && segment.y === position.y));
      food = position;
    }

    function isOppositeDirection(newDir) {
      return newDir.x === -direction.x && newDir.y === -direction.y;
    }

    function setDirection(newDir) {
      if (isOppositeDirection(newDir)) return;
      nextDirection = newDir;
    }

    function handleKey(event) {
      switch (event.key) {
        case "ArrowUp":
        case "w":
        case "W":
          setDirection({ x: 0, y: -1 });
          break;
        case "ArrowDown":
        case "s":
        case "S":
          setDirection({ x: 0, y: 1 });
          break;
        case "ArrowLeft":
        case "a":
        case "A":
          setDirection({ x: -1, y: 0 });
          break;
        case "ArrowRight":
        case "d":
        case "D":
          setDirection({ x: 1, y: 0 });
          break;
        case " ":
          togglePause();
          break;
        default:
          break;
      }
    }

    function togglePause() {
      isRunning = !isRunning;
      toggleBtn.textContent = isRunning ? "Пауза" : "Продолжить";
      restartLoop();
    }

    function restartLoop() {
      if (loopId) {
        clearInterval(loopId);
      }
      if (isRunning) {
        loopId = setInterval(step, getCurrentSpeed());
      }
    }

    function getCurrentSpeed() {
      const base = difficultySettings[difficultySelect.value] || difficultySettings.normal;
      return Math.max(60, base / speedMultiplier);
    }

    function step() {
      direction = { ...nextDirection };
      const head = snake[0];
      const newHead = {
        x: (head.x + direction.x + CELL_COUNT) % CELL_COUNT,
        y: (head.y + direction.y + CELL_COUNT) % CELL_COUNT
      };

      if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        speedMultiplier = Math.min(3, speedMultiplier + 0.1);
        spawnFood();
      } else {
        snake.pop();
      }

      if (score > bestScore) {
        bestScore = score;
        saveBestScore();
      }

      updateStats();
      draw();
      restartLoop();
    }

    function endGame() {
      isRunning = false;
      toggleBtn.textContent = "Начать";
      clearInterval(loopId);
      draw(true);
    }

    function draw(isGameOver = false) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#0b1120";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(148, 163, 184, 0.1)";
      for (let i = 0; i <= CELL_COUNT; i += 1) {
        const pos = i * GRID_SIZE;
        ctx.beginPath();
        ctx.moveTo(pos, 0);
        ctx.lineTo(pos, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, pos);
        ctx.lineTo(canvas.width, pos);
        ctx.stroke();
      }

      ctx.fillStyle = "#22c55e";
      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? "#4ade80" : "#22c55e";
        ctx.fillRect(
          segment.x * GRID_SIZE + 2,
          segment.y * GRID_SIZE + 2,
          GRID_SIZE - 4,
          GRID_SIZE - 4
        );
      });

      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.arc(
        food.x * GRID_SIZE + GRID_SIZE / 2,
        food.y * GRID_SIZE + GRID_SIZE / 2,
        GRID_SIZE / 2.6,
        0,
        Math.PI * 2
      );
      ctx.fill();

      if (isGameOver) {
        ctx.fillStyle = "rgba(15, 23, 42, 0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f87171";
        ctx.font = "bold 32px Segoe UI";
        ctx.textAlign = "center";
        ctx.fillText("Столкновение!", canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = "#e2e8f0";
        ctx.font = "16px Segoe UI";
        ctx.fillText("Нажмите «Новая игра»", canvas.width / 2, canvas.height / 2 + 18);
      }
    }

    document.addEventListener("keydown", handleKey);
    toggleBtn.addEventListener("click", togglePause);
    newGameBtn.addEventListener("click", resetGame);
    resetBestBtn.addEventListener("click", () => {
      bestScore = 0;
      saveBestScore();
      updateStats();
    });

    difficultySelect.addEventListener("change", () => {
      restartLoop();
    });

    document.querySelectorAll(".mobile-controls button").forEach(button => {
      button.addEventListener("click", () => {
        const dir = button.dataset.dir;
        if (dir === "up") setDirection({ x: 0, y: -1 });
        if (dir === "down") setDirection({ x: 0, y: 1 });
        if (dir === "left") setDirection({ x: -1, y: 0 });
        if (dir === "right") setDirection({ x: 1, y: 0 });
      });
    });

    loadBestScore();
    resetGame();
    draw();
  </script>
</body>
</html>
